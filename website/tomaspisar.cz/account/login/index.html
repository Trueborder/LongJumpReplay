<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Sign in to your LongJumpReplay or Pantheon player account.">
  <meta name="theme-color" content="#f2f0e9">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://account.tomaspisar.cz/login">
  <title>Sign in — LongJumpReplay account</title>
  <link rel="icon" type="image/svg+xml" href="https://tomaspisar.cz/assets/icons/favicon.svg">
  <link rel="stylesheet" href="https://tomaspisar.cz/assets/css/tokens.css"><link rel="stylesheet" href="https://tomaspisar.cz/assets/css/global.css"><link rel="stylesheet" href="https://tomaspisar.cz/assets/css/pages/legacy.css">
  <link rel="stylesheet" href="https://tomaspisar.cz/assets/css/components.css">
  <link rel="stylesheet" href="https://tomaspisar.cz/assets/css/pages/account.css?v=20261006-3">

</head>
<body class="account-page portal-login-page" data-portal-page="login">
  <a class="skip-link" href="#main" data-ui="skip">Skip to content</a>

  <main id="main" class="account-shell login-shell">
    <section class="account-login content-section" aria-labelledby="form-title">
      <div class="account-login-grid">
        <div class="account-panel login-card" aria-labelledby="form-title">
          <div class="login-card-bar">
            <a class="login-home-link" href="https://tomaspisar.cz/" aria-label="Tomáš Pisár home"><span class="brand-mark" aria-hidden="true">TP</span></a>
            <button class="language-button" data-lang-toggle data-lang-label type="button" aria-label="Switch to Czech">CZ</button>
          </div>
          <div class="panel-heading">
            <p class="login-destination-label" data-en="Signing in to" data-cs="Přihlašujete se do">Signing in to</p>
            <h1 id="form-title" data-en="LongJumpReplay" data-cs="LongJumpReplay">LongJumpReplay</h1>
          </div>
          <nav class="login-product-switcher" aria-label="Account destination">
            <a data-login-product="longjumpreplay" href="/login?product=longjumpreplay">LongJumpReplay</a>
            <a data-login-product="economysuite" href="/login?product=economysuite">Pantheon / EconomySuite</a>
          </nav>
          <form id="login-form" novalidate>
            <div id="email-step">
            <label for="email" data-en="Account email" data-cs="E-mail účtu">Account email</label>
            <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
             </div>
             <div id="password-step">
               <label for="password" data-en="Password" data-cs="Heslo">Password</label>
               <input id="password" name="password" type="password" autocomplete="current-password" minlength="12">
             </div>
            <div id="code-field" hidden>
              <label for="code" data-en="Six-digit code" data-cs="Šestimístný kód">Six-digit code</label>
              <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="123456">
            </div>
            <div id="migration-step" hidden>
              <p class="migration-note" data-en="Finish setting up your account before opening the dashboard." data-cs="Před otevřením přehledu dokončete nastavení účtu.">Finish setting up your account before opening the dashboard.</p>
              <label for="migration-first-name" data-en="First name" data-cs="Jméno">First name</label>
              <input id="migration-first-name" autocomplete="given-name">
              <label for="migration-last-name" data-en="Surname" data-cs="Příjmení">Surname</label>
              <input id="migration-last-name" autocomplete="family-name">
              <label for="migration-club-name" data-en="Club name (optional)" data-cs="Název klubu (volitelné)">Club name (optional)</label>
              <input id="migration-club-name" autocomplete="organization">
              <div id="migration-password-fields">
                <label for="migration-password" data-en="Password" data-cs="Heslo">Password</label>
                <input id="migration-password" type="password" autocomplete="new-password" minlength="12">
                <label for="migration-password-confirmation" data-en="Confirm password" data-cs="Potvrzení hesla">Confirm password</label>
                <input id="migration-password-confirmation" type="password" autocomplete="new-password" minlength="12">
              </div>
            </div>
            <button class="button button-primary button-full" id="login-submit" type="submit" data-en="Continue" data-cs="Pokračovat">Continue</button>
            <div class="login-actions-secondary">
              <button class="text-button" id="change-email" type="button" hidden data-en="Change email" data-cs="Změnit e-mail">Change email</button>
              <button class="text-button" id="resend-code" type="button" hidden data-en="Resend code" data-cs="Poslat kód znovu">Resend code</button>
            </div>
            <div id="reset-step" hidden>
              <label for="reset-code" data-en="Email code" data-cs="Kod z e-mailu">Email code</label>
              <input id="reset-code" name="reset-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="123456">
              <label for="new-password" data-en="New password" data-cs="Nove heslo">New password</label>
              <input id="new-password" name="new-password" type="password" autocomplete="new-password" minlength="12">
            </div>
            <div id="login-mode-actions" class="login-mode-actions">
              <button class="text-button login-forgot-button" id="forgot-password" type="button" data-en="Forgot password?" data-cs="Zapomenuté heslo?">Forgot password?</button>
              <button class="login-options-toggle" id="other-options-toggle" type="button" aria-expanded="false" aria-controls="login-other-options" data-en="Show other options" data-cs="Zobrazit další možnosti">Show other options</button>
              <div id="login-other-options" class="login-other-options" hidden>
                <button class="text-button" id="otp-mode-link" type="button" data-en="Use email code" data-cs="Použít kód z e-mailu">Use email code</button>
                <a class="text-button" href="/register" data-en="Create account" data-cs="Vytvořit účet">Create account</a>
              </div>
            </div>
            <div id="reset-actions" class="login-actions-secondary" hidden><button class="text-button" id="reset-back" type="button" data-en="Back to sign in" data-cs="Zpět na přihlášení">Back to sign in</button></div>
          </form>
          <p id="login-status" class="status" role="status" aria-live="polite"></p>
        </div>
      </div>
    </section>
  </main>

  <script src="https://tomaspisar.cz/assets/js/components/site-config.js"></script>
  <script src="https://tomaspisar.cz/assets/js/components/site.js"></script>
  <script src="https://tomaspisar.cz/assets/js/account/state.js"></script>
  <script src="https://tomaspisar.cz/assets/js/account/account.js?v=20261006-1"></script>
</body>
</html>
