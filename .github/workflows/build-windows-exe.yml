name: Build Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pytest
      - run: python app.py --self-test --self-test-report SELF_TEST.txt
      - name: Build and validate customer installer
        shell: cmd
        run: call scripts\build\BUILD_INSTALLER.bat --no-pause
      - uses: actions/upload-artifact@v4
        with:
          name: LongJumpReplay-4.0.0-Windows-x64
          path: |
            SELF_TEST.txt
            release/LongJumpReplay-Setup-4.0.0.exe
            release/LongJumpReplay-Setup-4.0.0.exe.sha256
