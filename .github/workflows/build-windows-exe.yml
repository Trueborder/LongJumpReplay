name: Build Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pytest
      - run: python app.py --self-test --self-test-report SELF_TEST.txt
      - run: python -m PyInstaller --noconfirm --clean LongJumpReplay.spec
      - name: Build Windows setup installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/LongJumpReplay/LongJumpReplay.exe release/LongJumpReplay.exe
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --name LongJumpReplay-Setup --icon assets/long_jump_replay.ico --add-binary "release/LongJumpReplay.exe;payload" --add-data "README_SHARE.txt;payload" --add-data "THIRD_PARTY_NOTICES.txt;payload" installer/setup.py
          Copy-Item dist/LongJumpReplay-Setup.exe release/LongJumpReplay-Setup-2.3.exe
          (Get-FileHash release/LongJumpReplay-Setup-2.3.exe -Algorithm SHA256).Hash | Set-Content release/LongJumpReplay-Setup-2.3.exe.sha256
      - shell: pwsh
        run: |
          & dist/LongJumpReplay/LongJumpReplay.exe --self-test --self-test-report dist/LongJumpReplay/SELF_TEST_FROZEN.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item README_SHARE.txt dist/LongJumpReplay/README.txt
          Copy-Item START_SYNTHETIC.bat dist/LongJumpReplay/START_SYNTHETIC.bat
          Copy-Item SELF_TEST_APPLICATION.bat dist/LongJumpReplay/SELF_TEST_APPLICATION.bat
          Compress-Archive -Path dist/LongJumpReplay/* -DestinationPath LongJumpReplay-2.3-Windows-x64.zip -Force
          (Get-FileHash LongJumpReplay-2.3-Windows-x64.zip -Algorithm SHA256).Hash | Set-Content LongJumpReplay-2.3-Windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LongJumpReplay-2.3-Windows-x64
          path: |
            LongJumpReplay-2.3-Windows-x64.zip
            SELF_TEST.txt
            LongJumpReplay-2.3-Windows-x64.zip.sha256
            release/LongJumpReplay-Setup-2.3.exe
            release/LongJumpReplay-Setup-2.3.exe.sha256
