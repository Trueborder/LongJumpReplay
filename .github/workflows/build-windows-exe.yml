name: Build Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pytest
      - run: python app.py --self-test --self-test-report SELF_TEST.txt
      - name: Build native PowerShell/IExpress installer
        shell: cmd
        run: call BUILD_INSTALLER.bat
      - uses: actions/upload-artifact@v4
        with:
          name: LongJumpReplay-3.1-Windows-x64
          path: |
            release/LongJumpReplay-3.1-Windows-x64.zip
            release/LongJumpReplay-3.1-Windows-x64.zip.sha256
            SELF_TEST.txt
            release/LongJumpReplay-Setup-3.1.exe
            release/LongJumpReplay-Setup-3.1.exe.sha256
